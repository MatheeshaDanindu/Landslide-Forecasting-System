# Two architectures: baseline + one comparison model.
baseline:
  arch: Unet
  encoder: resnet34
  encoder_weights: imagenet

comparison:
  arch: DeepLabV3Plus
  encoder: resnet34
  encoder_weights: imagenet

input_channels: 16  # 10 optical bands (BAND_ORDER) + NDVI + BSI + MNDWI + slope + aspect + curvature -> computed in-notebook (Step 4), not read from here yet

loss:
  focal_gamma: 2.0
  focal_alpha: 0.25
  dice_weight: 0.5    # final loss = (1 - dice_weight) * focal + dice_weight * dice

training:
  batch_size: 8
  epochs: 1            # placeholder for the synthetic smoke-test; raise once real data exists
  learning_rate: 0.0003
  random_seed: 42
