# Two architectures: baseline + one comparison model.
baseline:
  arch: Unet
  encoder: resnet34
  encoder_weights: imagenet

comparison:
  arch: DeepLabV3Plus
  encoder: resnet34
  encoder_weights: imagenet

input_channels: 16  # 10 bands + NDVI/BSI/MNDWI + slope/aspect/curvature

loss:
  focal_gamma: 2.0
  focal_alpha: 0.25
  dice_weight: 0.5    # final loss = (1 - dice_weight) * focal + dice_weight * dice

training:
  # batch_size 5 at 64x64 leaves the GPU mostly idle between steps. 32 was a
  # first bump; 64 cuts optimiser-step (and Python-loop) overhead further and
  # is still small in memory terms (64 x 16 x 64 x 64 float32 ~ 17MB/batch).
  # Not expected to hurt convergence at this short epoch budget -- Adam is
  # fairly batch-size-robust -- but flagged here since it changes the
  # documented hyperparameters: see EXPERIMENTAL_METHODOLOGY.md.
  batch_size: 64
  epochs: 5
  learning_rate: 0.0003
  random_seed: 42
