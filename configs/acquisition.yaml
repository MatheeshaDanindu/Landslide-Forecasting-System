# AOI bounding box derived directly from the ACCIMT label extent
# (see docs/data_card.md) — do not hand-tune without re-checking the labels.
aoi:
  min_lon: 80.019979
  min_lat: 6.562571
  max_lon: 81.400019
  max_lat: 8.067378

sentinel2:
  collection: SENTINEL2_L2A
  max_cloud_cover: 45             # percent, exclusive: scenes with eo:cloud_cover >= 45 are rejected. 20 was too
                                   # strict for a tropical/post-cyclone AOI and filtered out most available
                                   # Sentinel-2 passes -- raised to 45. Per-pixel SCL cloud/shadow masking (see
                                   # preprocessing) still applies downstream, so this scene-level threshold does
                                   # not let cloud-contaminated pixels into training patches.
  pre_event_cutoff: "2025-11-28"  # exclusive upper bound — see notebooks/landslide_pipeline.ipynb Step 2
  search_window_days: 90          # how far back from the cutoff to search for a clean scene
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12, SCL]

dem:
  source: COPERNICUS_30  # openEO collection id for Copernicus DEM GLO-30 — REQUIRES VERIFICATION against the live CDSE catalog before first run

# Both downloads are explicitly resampled to this CRS/resolution (see download_sentinel2 /
# download_dem) — without this, openEO returns each collection in its own native CRS
# (Copernicus DEM is natively EPSG:4326), silently breaking every downstream function that
# assumes a metric grid (slope/aspect, rasterize_labels, the exclusion-buffer check).
target_crs: "EPSG:32644"     # UTM 44N — must match preprocessing.yaml's crs.metric
target_resolution_m: 10

# Relative to DATA_DIR (the notebook's data root — local data/, or the
# Drive-backed folder in Colab), not to the repo root.
output_dir: raw

labels:
  path: raw/labels/Lanslides_Ditwah_2025.shp
