reflectance_scale: 0.0001  # Sentinel-2 L2A digital numbers -> physical reflectance [0, 1]

cloud_mask:
  scl_exclude: [3, 7, 8, 9, 10]  # cloud shadow, unclassified, cloud med/high probability, cirrus

patch:
  size_px: 256
  stride_px: 128
  resolution_m: 10  # see docs/data_card.md size-distribution analysis for why 256x256@10m

labels:
  min_minor_axis_m: 30  # below this: small-object eval cohort, not the training mask (docs/limitations.md)

crs:
  metric: "EPSG:32644"     # UTM 44N
  geographic: "EPSG:4326"
