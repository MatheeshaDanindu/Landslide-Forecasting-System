reflectance_scale: 0.0001  # Sentinel-2 L2A DN -> reflectance [0, 1]

cloud_mask:
  # 0=no data, 1=saturated/defective, 3=cloud shadow, 7=unclassified,
  # 8/9=cloud med/high prob, 10=thin cirrus, 11=snow/ice (confounds with bare-soil/scar spectra)
  scl_exclude: [0, 1, 3, 7, 8, 9, 10, 11]

patch:
  size_px: 64
  stride_px: 64
  resolution_m: 10

labels:
  min_minor_axis_m: 30  # below this: small-object eval cohort, not the training mask

crs:
  metric: "EPSG:32644"     # UTM 44N
  geographic: "EPSG:4326"
