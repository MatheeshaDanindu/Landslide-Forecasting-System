name: landslide-forecasting
channels:
  - conda-forge
dependencies:
  - python=3.11
  - geopandas
  - rasterio
  - gdal
  - fiona
  - shapely
  - pyproj
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pyyaml
  - python-dotenv
  - pytest
  - pip
  - pip:
      - openeo
# Deep-learning deps (torch, segmentation-models-pytorch) are added when the
# modeling milestone starts — not needed for the data pipeline / sample
# generation work this environment currently supports.
